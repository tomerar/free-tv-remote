name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint (ktlint, detekt, Android lint)
        run: ./gradlew check assembleDebug --stacktrace

      - name: Release signing guard rejects a missing signing configuration
        run: |
          # Published releases must never be built without the project key. Expect this build to FAIL.
          if REQUIRE_RELEASE_SIGNING=true ./gradlew :app:verifyReleaseSigning > guard.log 2>&1; then
            echo "The release signing guard did not reject a missing configuration"; cat guard.log; exit 1
          fi
          grep -q "Release signing is not configured completely" guard.log
          # The release workflow's own checks, exercised without secrets.
          if GITHUB_ENV=/dev/null .github/scripts/prepare-signing.sh publish > guard2.log 2>&1; then
            echo "publish mode accepted missing signing secrets"; cat guard2.log; exit 1
          fi
          grep -q "Release signing is not configured" guard2.log

      - name: Verify the APK contains the Hebrew translation
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -A3 "string/key_left" | grep -q '(iw)'

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/screenshots/
          if-no-files-found: ignore
