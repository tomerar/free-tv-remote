name: Release

# Two clearly separated modes:
#
#  * PUBLISH (a "v*" tag push, or a manual run with a tag name): builds the release APK, signs it with the
#    STABLE project key from repository secrets, and creates the GitHub Release. If the signing secrets are
#    missing or wrong the run fails before building anything. There is no fallback to a generated key.
#
#  * DEVELOPMENT BUILD (manual run with the tag left empty): builds an APK signed with a throw-away key and
#    uploads it as a workflow artifact only. It installs fine but is NOT update-compatible with any other
#    build, and it never creates a release.
#
# Maintainer guide: docs/RELEASING.md
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v0.1.1 (leave EMPTY for a development build that is not published)"
        required: false
        default: ""
        type: string

env:
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Decide the mode and validate the tag
        run: |
          if [ -n "$TAG" ]; then
            echo "MODE=publish" >> "$GITHUB_ENV"
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error title=Invalid tag::'$TAG' is not a version tag such as v1.2.3."
              exit 1
            fi
            VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
            if [ "v$VERSION_NAME" != "$TAG" ]; then
              echo "::error title=Tag and app version differ::The tag is $TAG but app/build.gradle.kts has versionName $VERSION_NAME. Bump versionCode and versionName first."
              exit 1
            fi
          else
            echo "MODE=dev" >> "$GITHUB_ENV"
            echo "::notice title=Development build::No tag given: this APK uses a one-off key, is not update-compatible and will not be published."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare the signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: .github/scripts/prepare-signing.sh "$MODE"

      - name: Build and test
        run: ./gradlew check assembleRelease --stacktrace

      - name: Verify the signature and the signing identity
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: .github/scripts/verify-signature.sh app/build/outputs/apk/release/app-release.apk "$MODE"

      - name: Name the APK and write the summary
        run: |
          if [ "$MODE" = publish ]; then
            NAME="FreeTVRemote-${TAG}.apk"
          else
            NAME="FreeTVRemote-dev-${GITHUB_SHA::7}-NOT-UPDATABLE.apk"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          {
            echo "### ${MODE^^} build"
            echo "- Signed with: $SIGNING_KIND"
            echo "- Signer certificate SHA-256: \`$CERT_SHA256\`"
            echo "- APK SHA-256: \`$(cut -d' ' -f1 "dist/$NAME.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODE == 'publish' && 'FreeTVRemote-release-apk' || 'FreeTVRemote-dev-apk-not-updatable' }}
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: env.MODE == 'publish'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Free TV Remote ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install
            1. Download the `.apk` file below on your Android phone (Android 8.0 or newer).
            2. Open it. If Android asks, allow your browser or file manager to **install unknown apps**.
            3. Tap **Install**, then open **Free TV Remote** and follow the pairing steps.

            Optional: check the download against the `.sha256` file. Full guide: https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md

            Signing certificate SHA-256 (the same for every update-compatible release): `${{ env.CERT_SHA256 }}`
