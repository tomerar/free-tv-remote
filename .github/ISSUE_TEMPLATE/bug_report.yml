name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: tv-model
    attributes:
      label: TV model
      description: Manufacturer and model, manufacturer, model and year.
    validations:
      required: true
  - type: input
    id: remote-service
    attributes:
      label: Android TV Remote Service version
      description: On the TV, Settings > Apps > See all apps > Android TV Remote Service (show system apps). It is the version shown at the bottom.
    validations:
      required: true
  - type: input
    id: tv-android
    attributes:
      label: TV Android / Google TV version
      placeholder: "Android TV 11 / Google TV 12"
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version and commit
      description: Settings > About shows both, for example "0.1.1 (a1b2c3d4e)".
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it fail?
      options:
        - Finding the TV
        - Pairing
        - Connecting / reconnecting
        - Sending keys
        - Typing text
        - App shortcuts
        - Volume buttons
        - Tile / widget
        - Layout / translation
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove anything private (IP addresses are fine to keep).
